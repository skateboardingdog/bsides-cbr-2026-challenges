name: "printf-golf"
description: "skateboarding dog CTF 2026 printf golf"

mode: ONCE
hostname: "jail"
cwd: "/chal"

time_limit: 5

uidmap { inside_id: "65534" outside_id: "0" count: 1 }
gidmap { inside_id: "65534" outside_id: "0" count: 1 }

clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true

mount_proc: true

rlimit_as: 1024
rlimit_cpu: 15
rlimit_fsize: 16
rlimit_nofile: 64
rlimit_nproc: 64

mount { src: "/lib"  dst: "/lib"  is_bind: true rw: false }
mount { src: "/lib64" dst: "/lib64" is_bind: true rw: false }
mount { src: "/usr"  dst: "/usr"  is_bind: true rw: false }
mount { src: "/etc"  dst: "/etc"  is_bind: true rw: false }

keep_env: false
envar: "PATH=/usr/bin"
envar: "LANG=C.UTF-8"
envar: "PYTHONDONTWRITEBYTECODE=1"

exec_bin {
  path: "/usr/bin/python3"
  arg: "/chal/check.py"
}
