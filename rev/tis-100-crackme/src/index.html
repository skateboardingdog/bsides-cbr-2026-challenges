<style>
  :root {
    --bg:        #000000;
    --fg:        #d6d6d6;
    --fg-dim:    #8f8f8f;
    --fg-dimmer: #5c5c5c;
    --line:      #808080;
    --fg-hi:     #f0f0f0;
    --edge:      #ffffff;
    --red:       #c8281c;
    --mono: "PerfectDOS", "DejaVu Sans Mono", ui-monospace, Menlo, Consolas, monospace;
    --gap: 22px;
    --node-w: 250px;
    --code-line: 14px;
    --stats-w: 56px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--mono); font-size: 13px; line-height: 1.3;
    letter-spacing: .3px;
    -webkit-font-smoothing: none; text-rendering: geometricPrecision;
    height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  #scaler { transform-origin: center center; }

  .uc { text-transform: uppercase; }

  .box { border: 2px solid var(--edge); background: #000; padding: 8px 10px; }
  .box .rule { border: none; border-top: 1px solid var(--line); margin: 6px 0; }

  .console { display: flex; gap: 22px; align-items: flex-start; }

  .left { width: 288px; flex: 0 0 288px; display: flex; flex-direction: column; gap: 14px; }
  .title { text-align: center; }
  .title .brand { display: inline-block; font-weight: 700; font-size: 15px; letter-spacing: 4px;
    padding: 1px 8px; border: 2px solid var(--edge); border-radius: 9px; color: var(--fg); }
  .title .brand b { color: var(--fg); }
  .title .name { margin-top: 8px; letter-spacing: 3px; color: var(--fg); font-size: 13px; }
  .title .seg { color: var(--fg-dim); font-size: 11px; letter-spacing: 2px; }

  .desc p { margin: 0 0 6px; color: var(--fg-dim); font-size: 12.5px; line-height: 1.5; }
  .desc p.hi { color: var(--fg); }
  .desc .obj { color: var(--fg); margin-top: 8px; white-space: normal; }
  .desc .obj b { color: var(--fg-hi); }

  .pass label { display: block; font-size: 11px; letter-spacing: 2px; color: var(--fg-dim); margin-bottom: 6px; }
  .passrow { display: flex; gap: 8px; }
  .pass input { flex: 1 1 auto; min-width: 0; background: #000; border: 2px solid var(--edge);
    color: var(--fg); font-family: var(--mono); font-size: 14px; letter-spacing: 1px; padding: 7px 8px;
    outline: none; caret-color: var(--red); }
  .btn { font-family: var(--mono); font-size: 12px; letter-spacing: 1.5px; color: var(--fg);
    background: #000; border: 2px solid var(--edge); padding: 6px 12px; cursor: pointer; }
  .btn:hover { color: #000; background: var(--edge); }
  .btn:active { color: var(--fg); background: #000; }

  .streams { display: flex; gap: 10px; }
  .streamcol { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; }
  .streamcol .sh { font-size: 11px; letter-spacing: 1px; color: var(--fg); margin-bottom: 4px; white-space: nowrap; }
  .streamcol .sbody { width: 100%; border: 2px solid var(--edge); background: #000; height: 214px;
    overflow-y: auto; padding: 2px 0; }
  .streamcol .v { text-align: center; font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--fg); padding: 0 4px; }
  .streamcol .v.done { color: var(--fg-dimmer); }
  .streamcol .v.next { color: #000; background: var(--fg); }
  .streamcol .v.ok { color: var(--fg-hi); } .streamcol .v.bad { color: var(--red); }
  .streamcol .ph { color: var(--fg-dimmer); text-align: center; font-size: 12px; padding: 6px 0; }

  .controls { display: flex; gap: 8px; }
  .tbtn { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 5px;
    background: #000; border: 2px solid var(--edge); padding: 9px 2px 6px; cursor: pointer;
    font-family: var(--mono); }
  .tbtn .g { font-size: 15px; line-height: 1; color: var(--fg); }
  .tbtn .l { font-size: 9px; letter-spacing: 1.5px; color: var(--fg-dim); }
  .tbtn:hover .g, .tbtn:hover .l { color: #fff; }
  .tbtn.active { background: var(--edge); }
  .tbtn.active .g, .tbtn.active .l { color: #000; }

  .verdict { text-align: center; padding: 11px; font-size: 17px; letter-spacing: 4px; font-weight: 700;
    color: var(--fg-dimmer); border: 2px solid var(--edge); background: #000; }
  .verdict.correct { background: var(--edge); color: #000; }
  .verdict.wrong { color: var(--red); border-color: var(--red); }
  .verdict.hung { color: var(--red); border-color: var(--red); }

  .grid-area { flex: 1 1 auto; min-width: 0; }
  .grid-wrap { overflow: visible; padding: 2px; }
  .machine { display: inline-flex; flex-direction: column; gap: 6px; }
  .lane, .nodes { display: grid; grid-template-columns: repeat(var(--cols), var(--node-w)); column-gap: var(--gap); }
  .nodes { row-gap: var(--gap); }
  .marker { text-align: center; font-size: 11px; letter-spacing: 1px; color: var(--fg); height: 16px; white-space: nowrap; }
  .marker.empty { color: transparent; }

  .node { position: relative; border: 2px solid var(--line); background: #000; display: flex;
    height: calc(15 * var(--code-line) + 6px); overflow: hidden; }
  .code { flex: 1 1 auto; min-width: 0; padding: 3px 0; }
  .code .ln { height: var(--code-line); line-height: var(--code-line); padding: 0 7px; white-space: pre;
    overflow: hidden; text-overflow: clip; font-size: 12.5px; color: var(--fg); }
  .code .ln.cmt { color: var(--fg-dim); }
  .code .ln.active { background: var(--fg); color: #000; }

  .stats { flex: 0 0 var(--stats-w); display: flex; flex-direction: column; border-left: 2px solid var(--line); }
  .stat { flex: 1 1 0; border-bottom: 2px solid var(--line); padding: 2px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 1px; }
  .stat:last-child { border-bottom: none; }
  .stat .k { font-size: 11px; letter-spacing: 0; color: var(--fg-dim); line-height: 1.1; }
  .stat .v { font-size: 11px; color: var(--fg); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat .v.read, .stat .v.wrte, .stat .v.run { color: var(--fg); } .stat .v.idle { color: var(--fg-dim); }

  .node.damaged { border-color: var(--red); align-items: center; justify-content: center; flex-direction: column;
    gap: 8px; color: var(--red); letter-spacing: 2px; font-size: 12px; text-align: center; }
  .node.stack .label { flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 6px; color: var(--fg); font-size: 11px; letter-spacing: 1px; line-height: 1.5; }
  .node.stack .sk { flex: 0 0 var(--stats-w); border-left: 2px solid var(--line); display: flex;
    flex-direction: column; padding: 2px 0; overflow: hidden; }
  .node.stack .sk .cell { text-align: center; font-size: 11px; color: var(--fg);
    font-variant-numeric: tabular-nums; line-height: 1.35; }

  .conn { position: absolute; z-index: 3; background: #000; padding: 0 2px; white-space: nowrap;
    font-size: 12px; font-variant-numeric: tabular-nums; color: var(--fg-dimmer); }
  .conn.active { color: var(--fg); }
  .conn.down  { left: 50%; top: 100%;  transform: translate(-50%, calc(var(--gap)/2 - 50%)); }
  .conn.right { top: 50%;  left: 100%; transform: translate(calc(var(--gap)/2 - 50%), -50%); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <div id="scaler">
  <div class="console">
    <aside class="left">
      <div class="box title" style="margin-top: 96px;">
        TIS<b>-</b>100: crackme
      </div>

      <div class="box desc">
        <p>&gt; Check out the <a href="https://www.zachtronics.com/images/TIS-100P%20Reference%20Manual.pdf">TIS-100 Reference Manual</a>.</p>
        <p>&gt; Find the passphrase that makes OUT.OK report 1.</p>
        <p>&gt; The passphrase is 16 characters and does not include skbdg{}. Wrap it in skbdg{} to get the flag.</p>
      </div>

      <div class="box pass">
        <label for="pass">IN.PASS - passphrase</label>
        <div class="passrow">
          <input id="pass" type="text" spellcheck="false" autocomplete="off" maxlength="16" placeholder="..." />
          <button class="btn" id="check">CHECK</button>
        </div>
      </div>

      <div class="streams" id="streams"></div>

      <div class="controls">
        <button class="tbtn" id="btnStop"><span class="g">■</span><span class="l">STOP</span></button>
        <button class="tbtn" id="btnStep"><span class="g">▶|</span><span class="l">STEP</span></button>
        <button class="tbtn" id="btnRun"><span class="g">▶</span><span class="l">PLAY</span></button>
        <button class="tbtn" id="btnFast"><span class="g">▶▶</span><span class="l">FAST</span></button>
      </div>

      <div class="verdict" id="verdict">- - -</div>
    </aside>

    <main class="grid-area">
      <div class="grid-wrap"><div class="machine" id="machine"></div></div>
    </main>
  </div>
  </div>

  <script>
(function (root) {
  "use strict";
  const DIRS = ["UP", "DOWN", "LEFT", "RIGHT"];
  const OPP = { UP: "DOWN", DOWN: "UP", LEFT: "RIGHT", RIGHT: "LEFT" };
  const ANY_ORDER = ["LEFT", "RIGHT", "UP", "DOWN"];
  const clamp = (v) => (v > 999 ? 999 : v < -999 ? -999 : v);
  const REGS = new Set(["ACC", "NIL"]);
  const PORTS = new Set(["UP", "DOWN", "LEFT", "RIGHT", "ANY", "LAST"]);
  const JUMPS = new Set(["JMP", "JEZ", "JNZ", "JGZ", "JLZ"]);
  function parseOperand(tok) {
    const t = tok.toUpperCase();
    if (REGS.has(t)) return t === "NIL" ? { k: "nil" } : { k: "acc" };
    if (PORTS.has(t)) return { k: "port", dir: t };
    if (/^-?\d+$/.test(t)) return { k: "lit", v: clamp(parseInt(t, 10)) };
    return { k: "err", tok };
  }
  function parseProgram(text) {
    const rawLines = text.split(/\r?\n/);
    const instrs = [];
    const labels = {};
    let title = null;
    let error = null;
    rawLines.forEach((raw, lineNo) => {
      let line = raw;
      const dbl = line.indexOf("##");
      if (dbl !== -1 && title === null) title = line.slice(dbl + 2).trim();
      const hash = line.indexOf("#");
      if (hash !== -1) line = line.slice(0, hash);
      let bp = false;
      line = line.replace(/^\s*!/, () => { bp = true; return ""; });
      let m;
      while ((m = line.match(/^\s*([A-Za-z_][A-Za-z0-9_]*)\s*:/))) {
        labels[m[1].toUpperCase()] = instrs.length;
        line = line.slice(m[0].length);
      }
      const s = line.trim();
      if (s === "") { if (bp) {  } return; }
      const parts = s.replace(/,/g, " ").split(/\s+/).filter(Boolean);
      let op = parts[0].toUpperCase();

    const b = s.body; b.innerHTML = "";
    if (s.kind === "out") {
      const vals = s.node.values;
      if (!vals.length) { b.appendChild(el("div", "ph", "-")); return; }
      vals.forEach((v) => b.appendChild(el("div", "v " + (v === 1 ? "ok" : v === 0 ? "bad" : ""), v)));
      return;
    }
    const vals = s.node.values, idx = s.node.idx;
    vals.forEach((v, i) => {
      let cls = "v"; if (i < idx) cls += " done"; else if (i === idx) cls += " next";
      b.appendChild(el("div", cls, v));
    });
  }

  function stepMachine() {
    const prog = machine.step();
    for (const n of machine.nodes) if (n.type === "T21" && (n.status === "READ" || n.status === "WRITE")) machine._blocked[n.id] = (machine._blocked[n.id] || 0) + 1;
    idleStreak = prog ? 0 : idleStreak + 1;
    return prog;
  }
  const finished = () => machine && machine.outputs[0].values.length >= 1;
  const deadlocked = () => idleStreak > 1;

  function settle() { stopTimer(); if (finished()) setVerdict(machine.outputs[0].values[0]); else setVerdict("hung"); }

  function setVerdict(v) {
    const e = $("#verdict");
    if (v === null) { e.textContent = "- - -"; e.className = "verdict"; }
    else if (v === 1) { e.textContent = "CORRECT"; e.className = "verdict correct"; }
    else if (v === 0) { e.textContent = "WRONG"; e.className = "verdict wrong"; }
    else { e.textContent = "HUNG"; e.className = "verdict hung"; }
  }

  function ensure() { if (!machine || dirty) { buildMachine($("#pass").value); dirty = false; } }
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } $("#btnRun").classList.remove("active"); }

  function doStep() { ensure(); if (finished()) return; stepMachine(); update(); if (finished() || deadlocked()) settle(); }
  function doFast() { ensure(); stopTimer(); let g = CAP; while (!finished() && !deadlocked() && g-- > 0) stepMachine(); update(); settle(); }
  function doPlay() {
    if (timer) { stopTimer(); return; }
    ensure(); if (finished()) return;
    $("#btnRun").classList.add("active");
    timer = setInterval(() => {
      if (finished() || deadlocked() || machine.cycle > CAP) { update(); settle(); return; }
      stepMachine(); update();
    }, RUN_MS);
  }
  function doStop() { stopTimer(); buildMachine($("#pass").value); dirty = false; }
  function doCheck() { stopTimer(); buildMachine($("#pass").value); dirty = false; doFast(); }

  function fit() {
    const s = document.getElementById("scaler");
    if (!s) return;
    s.style.zoom = "1";
    const natW = s.offsetWidth, natH = s.offsetHeight;
    if (!natW || !natH) return;
    const scale = Math.min((window.innerWidth - 16) / natW, (window.innerHeight - 16) / natH);
    s.style.zoom = scale;
  }

  window.addEventListener("resize", fit);
  window.addEventListener("DOMContentLoaded", () => {
    $("#btnStop").addEventListener("click", doStop);
    $("#btnStep").addEventListener("click", doStep);
    $("#btnRun").addEventListener("click", doPlay);
    $("#btnFast").addEventListener("click", doFast);
    $("#check").addEventListener("click", doCheck);
    $("#pass").addEventListener("input", () => { dirty = true; });
    $("#pass").addEventListener("keydown", (e) => { if (e.key === "Enter") doCheck(); });
    buildMachine("");
    fit();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  });
})();
  </script>
</body>
</html>
